<nav class="border-gray-200 bg-white">
  <div
    class="mx-auto flex max-w-screen-xl flex-wrap items-center justify-between p-4"
  >
    <a
      href="https://flowbite.com/"
      class="flex items-center space-x-3 rtl:space-x-reverse"
    >
      <span class="self-center text-xl font-bold whitespace-nowrap"
        >Exclusive</span
      >
    </a>

    <div
      class="flex items-center space-x-1 md:order-2 md:space-x-0 rtl:space-x-reverse"
    >
      <!-- Bouton Navbar -->

      <a routerLink="/wishlist">
        <img
          class="mr-4 h-8 w-8"
          src="assets/heart-regular.svg"
          alt="heart photo"
        />
      </a>

      <a routerLink="/cart">
        <img
          class="mr-4 h-8 w-8"
          src="assets/cart-shopping-solid.svg"
          alt="cart photo"
        />
      </a>

      <a href="/profile">
        <img
          class="mr-4 h-8 w-8"
          src="assets/user-regular.svg"
          alt="user photo"
        />
      </a>

      <!-- Sélecteur de langue  -->
      <select
        class="cursor-pointer rounded-lg border-0 px-4 py-2 pr-7 text-sm font-medium text-gray-900 hover:bg-gray-100 focus:ring-2 focus:ring-blue-500"
      >
        <option>English</option>
        <option>Français</option>
      </select>

      <!-- Bouton menu mobile -->
      <button
        (click)="toggleMobileMenu()"
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg p-2 text-sm text-gray-500 hover:bg-gray-100 focus:ring-2 focus:ring-gray-200 focus:outline-none md:hidden"
      >
        <span class="sr-only">Open main menu</span>
        <svg
          class="h-5 w-5"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 17 14"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M1 1h15M1 7h15M1 13h15"
          />
        </svg>
      </button>
    </div>

    <!-- Menu principal -->
    <div
      [ngClass]="{
        hidden: !isMobileMenuOpen,
        block: isMobileMenuOpen,
      }"
      class="w-full items-center justify-between md:order-1 md:flex md:w-auto"
      id="navbar-language"
    >
      <ul
        class="mt-4 flex flex-col rounded-lg border border-gray-100 bg-gray-50 p-4 font-medium md:mt-0 md:flex-row md:space-x-8 md:border-0 md:bg-white md:p-0 rtl:space-x-reverse dark:border-gray-700 dark:bg-gray-800 md:dark:bg-gray-900"
      >
        <li>
          <a
            routerLink="/"
            class="block rounded-sm px-3 py-2 text-gray-900 hover:bg-gray-100 md:p-0 md:hover:bg-transparent md:hover:text-blue-700 dark:border-gray-700 dark:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent md:dark:hover:text-blue-500"
            >Home</a
          >
        </li>
        <li>
          <a
            routerLink="/contact"
            class="block rounded-sm px-3 py-2 text-gray-900 hover:bg-gray-100 md:p-0 md:hover:bg-transparent md:hover:text-blue-700"
            >Contact</a
          >
        </li>
        <li>
          <a
            routerLink="/about"
            class="block rounded-sm bg-blue-700 px-3 py-2 text-white md:bg-transparent md:p-0 md:text-blue-700"
            >About</a
          >
        </li>
        <li>
          <a
            routerLink="/signup"
            class="block rounded-sm px-3 py-2 text-gray-900 hover:bg-gray-100 md:p-0 md:hover:bg-transparent md:hover:text-blue-700"
            aria-current="page"
            >Sign Up</a
          >
        </li>
      </ul>
    </div>
  </div>
</nav>
